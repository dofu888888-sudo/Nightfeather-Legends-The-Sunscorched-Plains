<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>夜羽傳說－烈日草原</title><style>
:root{--ink:#403626;--paper:#f6ecd2;--gold:#b88a43;--green:#607d5a}*{box-sizing:border-box}body{margin:0;background:#d9c6a2;color:var(--ink);font-family:Georgia,'Noto Serif TC',serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}#app{max-width:700px;margin:auto;min-height:100dvh;background:var(--paper);box-shadow:0 0 35px #57432755}.top{padding:15px;background:#e6d4aa;border-bottom:2px solid #a88d5b;display:flex;justify-content:space-between;align-items:center;gap:10px}.top small{display:block;color:#746349}h1,h2,h3{margin:8px 0 12px}h1{font-size:27px}h2{font-size:21px}.content{padding:16px 17px 110px}.scene{height:215px;overflow:hidden;border:5px solid #e2cda3;border-radius:14px;position:relative;background:linear-gradient(#a8c8c3 0%,#f9dd9c 55%,#c9b77a 56%,#8da76d 100%);margin-bottom:16px}.scene:before{content:' ';position:absolute;left:60%;top:18%;width:75px;height:75px;border-radius:50%;background:#fff1b2;box-shadow:0 0 60px #ffeb9c}.scene:after{content:'♧  ♧     ♧    ♧';position:absolute;bottom:6px;left:0;width:100%;font-size:58px;color:#5b7851;letter-spacing:20px;opacity:.8}.scene.forest{background:linear-gradient(#677e78,#adc4a0 50%,#526d50)}.scene.guild{background:linear-gradient(#c2a17a,#e5c9a1 50%,#a9875d)}.scene.battle{background:linear-gradient(#c8b19b,#e8d7ae 55%,#9d9b6c)}.scene .scene-title{position:absolute;z-index:2;bottom:14px;left:12px;background:#fff5dcda;padding:7px 14px;border-radius:8px;font-weight:bold}.panel{border:1px solid #c5aa79;background:#fff8e8;border-radius:12px;padding:13px;margin:12px 0;box-shadow:0 2px 0 #d2b988}.muted{color:#796d58;font-size:13px}.btn{border:1px solid #9e8054;border-radius:9px;background:#e9d6aa;color:#453724;padding:11px 12px;font:inherit;cursor:pointer;min-height:43px}.btn.primary{background:#6c8060;color:white;border-color:#52684c}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}.actions .wide{grid-column:1/-1}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(700px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#eadab8;border-top:2px solid #b99e6b;padding:7px 3px max(7px,env(safe-area-inset-bottom));z-index:20}.nav button{font-size:12px;padding:8px 2px;border:0;background:none;color:#55452d}.nav button.active{font-weight:bold;color:#366444}.stat{display:flex;justify-content:space-between;gap:12px;margin:6px 0}.bar{height:9px;border-radius:10px;background:#d7c8aa;overflow:hidden}.bar>i{display:block;height:100%;background:#8caa79}.bar.mp>i{background:#829fb5}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{min-height:115px;text-align:left;background:#f3e5c8;border:2px solid #b89a68;border-radius:12px;padding:10px;color:#433525;font:inherit}.card strong{display:block}.card small{display:block;margin-top:8px;color:#77674f}.card:disabled{opacity:.45}input,textarea,select{width:100%;padding:12px;border-radius:8px;border:1px solid #b9a47f;background:#fffdf5;font:inherit;color:var(--ink)}label{display:block;margin:10px 0 5px}.tag{display:inline-block;padding:3px 8px;border-radius:12px;background:#e3d5b6;font-size:12px;margin:3px}.log{max-height:180px;overflow:auto;font-size:13px;background:#efe4c9;padding:10px;border-radius:8px}.enemy{font-size:85px;text-align:center;filter:drop-shadow(0 9px 4px #473c3255);padding:12px}.portrait{font-size:55px;text-align:center}.notice{padding:10px;background:#f0e2b8;border-left:4px solid #ae8345;margin:10px 0}button:focus-visible{outline:3px solid #345d80}@media(min-width:650px){.scene{height:290px}.cards{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div id="app"></div><script>
'use strict';const KEY='nightfeather_alpha_010';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const classes={mage:['魔導士','🪄'],sage:['賢者','📖'],sword:['劍士','⚔️'],fighter:['武者','🥊'],archer:['弓箭手','🏹'],assassin:['暗殺者','🗡️']};const cards={fire:['火球術',2,5,'攻擊'],ice:['冰霜箭',2,4,'攻擊'],focus:['魔力集中',1,0,'回魔'],heal:['治癒術',2,0,'治療'],barrier:['元素屏障',1,0,'護盾'],spirit:['精神共鳴',1,0,'回魔'],slash:['重斬',2,6,'攻擊'],counter:['格擋反擊',1,0,'護盾'],wave:['劍氣',2,5,'攻擊'],punch:['崩拳',2,6,'攻擊'],rage:['戰意燃燒',1,0,'強化'],break:['破甲擊',2,5,'攻擊'],aim:['精準射擊',2,6,'攻擊'],wind:['疾風箭',2,5,'攻擊'],sense:['獵人直覺',1,0,'強化'],stab:['背刺',2,7,'攻擊'],smoke:['煙霧彈',1,0,'護盾'],step:['影步',1,0,'強化'],guard:['守護姿態',1,0,'護盾'],strike:['奮力一擊',2,5,'攻擊']};const classDeck={mage:['fire','ice','focus'],sage:['heal','barrier','spirit'],sword:['slash','counter','wave'],fighter:['punch','rage','break'],archer:['aim','wind','sense'],assassin:['stab','smoke','step']};const enemies={wolf:{name:'異變草原狼',icon:'🐺',hp:35,atk:7,def:2,exp:25,gold:20},boar:{name:'岩牙野豬',icon:'🐗',hp:51,atk:9,def:4,exp:34,gold:27},scorpion:{name:'赤尾毒蠍',icon:'🦂',hp:45,atk:10,def:3,exp:40,gold:32},boss:{name:'赤鬃狼王',icon:'🐺',hp:125,atk:13,def:5,exp:140,gold:150}};let state=null,tab='adventure',battle=null,msg='',event=null;function save(){if(state){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){msg='無法寫入本機存檔，請匯出備份。'}}}function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&d.version===1&&d.player&&d.world)return d}catch(e){}return null}function advance(hours){state.world.hours+=hours;state.player.ageDays+=hours/24;state.player.fatigue=Math.min(100,state.player.fatigue+Math.ceil(hours/2));save()}function date(){let d=Math.floor(state.world.hours/24);return `卡布塔曆 ${17+Math.floor(d/360)} 年 · ${1+Math.floor(d%360/30)} 月 ${1+d%30} 日` }function age(){return (state.player.ageDays/360).toFixed(1)}function stats(p){return Object.entries(p.stats).map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('')}function base(){return `<header class="top"><div><small>手繪奇幻繪本風 · Alpha 0.1.0</small><strong>夜羽傳說－烈日草原</strong></div>${state?`<small>${esc(state.player.name)} · Lv.${state.player.level}<br>${date()}</small>`:''}</header>`}function scene(title,kind=''){return `<div class="scene ${kind}"><div class="scene-title">${esc(title)}</div></div>`}function render(){let html=base();if(!state){html+=setup();$('#app').innerHTML=html;return}html+=`<main class="content">${msg?`<div class="notice">${esc(msg)}</div>`:''}${battle?battleView():event?eventView():({adventure:adventureView,character:characterView,cards:deckView,life:lifeView,system:systemView}[tab]||adventureView)()}</main><nav class="nav">${[['adventure','🧭 冒險'],['character','👤 角色'],['cards','🃏 卡牌'],['life','🏠 生活'],['system','⚙️ 系統']].map(([id,t])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')" ${battle?'disabled':''}>${t}</button>`).join('')}</nav>`;$('#app').innerHTML=html}function setup(){return `<main class="content">${scene('卡布塔島 · 天神墜落後第十七年')}<h1>你的傳說，由此開始</h1><p>天神墜落改變了卡布塔島上的萬物。冒險公會正招募能夠探索烈日草原的冒險者。</p><div class="panel"><label>冒險者姓名</label><input id="name" maxlength="20" placeholder="輸入名字"><label>年齡（18–49）</label><input id="age" type="number" min="18" max="49" value="20"><label>人物背景描述</label><textarea id="bio" rows="4" maxlength="500" placeholder="例如：我在邊境長大，從小練習弓箭，擅長觀察與追蹤……"></textarea><label>職業（可依背景推薦）</label><select id="job"><option value="auto">依照背景自動判斷</option>${Object.entries(classes).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><div class="actions"><button class="btn primary wide" onclick="create()">建立冒險者，進入曙光鎮</button>${load()?'<button class="btn wide" onclick="continueGame()">繼續上次冒險</button>':''}</div></div><p class="muted">角色背景使用離線關鍵字規則解析，無需網路；本版本為可遊玩的初期原型。</p></main>`}function chooseClass(b){let keys={mage:/魔法|元素|法術|火球|魔導/,sage:/賢者|治療|學者|研究|知識|書籍/,sword:/劍|騎士|盾|守護|軍人/,fighter:/拳|格鬥|武術|力量|肌肉/,archer:/弓|射擊|狩獵|獵人|追蹤/,assassin:/暗殺|匕首|潛行|刺客|隱匿/};let found=Object.keys(keys).find(k=>keys[k].test(b));return found||'sword'}function create(){let name=$('#name').value.trim(),bio=$('#bio').value.trim(),ageN=Number($('#age').value);if(!name||!bio||!Number.isInteger(ageN)||ageN<18||ageN>49){alert('請輸入姓名、人物描述及18–49歲的年齡。');return}let job=$('#job').value==='auto'?chooseClass(bio):$('#job').value;let st={STR:10,INT:10,AGI:10,PER:10,VIT:10,WIL:10};({mage:'INT',sage:'WIL',sword:'STR',fighter:'STR',archer:'PER',assassin:'AGI'})[job]&&(st[({mage:'INT',sage:'WIL',sword:'STR',fighter:'STR',archer:'PER',assassin:'AGI'})[job]]+=5);state={version:1,player:{name,bio,job,ageDays:ageN*360,level:1,exp:0,gold:100,stats:st,points:0,hp:100,maxHp:100,mp:40,maxMp:40,fatigue:0,deck:[...classDeck[job],...classDeck[job],...classDeck[job],'guard','strike','strike'],inventory:{'藥草':0,'狼牙':0,'藥水':2},durability:100,home:0,retired:false,generation:1},world:{hours:0,location:'曙光鎮',quest:0,kills:0,boss:false,achievements:[],events:0}};msg=`公會接待員艾琳：歡迎你，${name}！你的冒險者資格已經登記完成。`;save();render()}function continueGame(){state=load();msg='已載入冒險紀錄。';render()}function go(t){tab=t;msg='';event=null;render()}function bar(n,max,cls=''){return `<div class="bar ${cls}"><i style="width:${Math.max(0,Math.min(100,n/max*100))}%"></i></div>`}function adventureView(){let p=state.player,w=state.world;return `${scene(w.location,w.location==='曙光鎮'?'guild':'')}<h2>${esc(w.location)}</h2><div class="panel"><div class="stat"><b>${esc(p.name)} · ${classes[p.job][0]}</b><span>Lv.${p.level} · ${age()} 歲</span></div><small>HP ${p.hp}/${p.maxHp}</small>${bar(p.hp,p.maxHp)}<small>MP ${p.mp}/${p.maxMp}</small>${bar(p.mp,p.maxMp,'mp')}<div class="stat"><span>金幣 ${p.gold} G</span><span>EXP ${p.exp}/${p.level*60}</span></div></div><div class="panel"><h3>📜 主線任務</h3><p>${['初來乍到：在公會登記並接受委託','第一次委託：採集 3 株藥草','不尋常的野獸：擊敗 3 隻草原狼','草原上的咆哮：擊敗赤鬃狼王','墜星的痕跡：向公會回報發現'][Math.min(w.quest,4)]||'第一章暫告段落'}</p></div><div class="actions">${w.location==='曙光鎮'?`<button class="btn primary" onclick="quest()">📜 冒險公會</button><button class="btn" onclick="rest()">🛏️ 旅館休息 (15G)</button><button class="btn" onclick="shop()">🧪 購買藥水 (25G)</button><button class="btn" onclick="travel('烈日草原')">🌾 前往烈日草原</button>`:`<button class="btn primary" onclick="explore()">🔎 探索草原</button><button class="btn" onclick="travel('曙光鎮')">🏘️ 返回曙光鎮</button><button class="btn" onclick="usePotion(false)">🧪 使用藥水 (${p.inventory['藥水']||0})</button><button class="btn" onclick="huntBoss()" ${w.quest<3||w.boss?'disabled':''}>🐺 挑戰赤鬃狼王</button>`}</div><p class="muted">探索會推進遊戲時間。第一章目前開放曙光鎮及烈日草原。</p>`}function quest(){let w=state.world,p=state.player;if(w.quest===0){w.quest=1;msg='接受第一份委託：採集 3 株藥草。'}else if(w.quest===1&&p.inventory['藥草']>=3){p.inventory['藥草']-=3;p.gold+=70;gainExp(45);w.quest=2;msg='委託完成！獲得70G、45EXP。新任務：擊敗3隻草原狼。'}else if(w.quest===2&&w.kills>=3){p.gold+=100;gainExp(65);w.quest=3;msg='討伐任務完成！獲得100G、65EXP。狼王的巢穴已被發現。'}else if(w.quest===4){p.gold+=200;gainExp(120);w.quest=5;achieve('烈日草原的守護者');msg='第一章試玩主線完成！獲得200G、120EXP。'}else msg=w.quest===5?'第一章試玩內容已完成，可繼續探索與養成。':'委託尚未達成，請繼續探索。';save();render()}function rest(){let p=state.player;if(p.gold<15){msg='金幣不足。';render();return}p.gold-=15;p.hp=p.maxHp;p.mp=p.maxMp;p.fatigue=0;advance(8);msg='你在旅館安穩休息，恢復了全部生命與魔力。';render()}function shop(){let p=state.player;if(p.gold<25){msg='金幣不足。';render();return}p.gold-=25;p.inventory['藥水']=(p.inventory['藥水']||0)+1;save();msg='購買了1瓶藥水。';render()}function travel(where){advance(3);state.world.location=where;event=null;msg=`你抵達了${where}。`;save();render()}function explore(){if(state.player.hp<=0)return;advance(2);state.world.events++;let r=Math.random();if(r<.38){event={type:'herb'};msg=''}else if(r<.52){event={type:'traveler'};msg=''}else{startBattle(r>.85?'boar':'wolf');return}render()}function eventView(){return `${scene('草原上的偶遇')}<h2>${event.type==='herb'?'草叢中的藥草':'迷路的旅人'}</h2><p>${event.type==='herb'?'你發現岩石旁生長著幾株散發清香的藥草。':'一名旅人坐在路邊，看起來疲憊不堪。他請求你提供一點幫助。'}</p><div class="actions"><button class="btn primary" onclick="eventResolve(true)">${event.type==='herb'?'採集藥草':'幫助旅人'}</button><button class="btn" onclick="eventResolve(false)">離開</button></div>`}function eventResolve(yes){if(yes){if(event.type==='herb'){let n=rand(1,2);state.player.inventory['藥草']+=n;msg=`採集到 ${n} 株藥草。`}else{state.player.gold+=rand(8,22);msg='旅人感謝你的協助，贈送一些金幣。'}}else msg='你繼續踏上旅程。';event=null;save();render()}function huntBoss(){startBattle('boss')}function startBattle(id){let e=enemies[id];battle={id,hp:e.hp,maxHp:e.hp,ap:3,shield:0,bonus:0,turn:1,hand:[],draw:[],discard:[],logs:[`遭遇 ${e.name}！`]};shuffleDeck();drawCards(4);msg='';render()}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}function shuffleDeck(){battle.draw=shuffle([...state.player.deck]);battle.discard=[]}function drawCards(n){for(let i=0;i<n;i++){if(!battle.draw.length){if(!battle.discard.length)break;battle.draw=shuffle(battle.discard.splice(0))}battle.hand.push(battle.draw.pop())}}function battleView(){let b=battle,e=enemies[b.id],p=state.player;return `${scene('戰鬥 · 烈日草原','battle')}<div class="panel"><h2>${e.name} · ${b.turn} 回合</h2><div class="enemy">${e.icon}</div><small>敵人 HP ${b.hp}/${b.maxHp}</small>${bar(b.hp,b.maxHp)}<div class="stat"><span>🧍 ${esc(p.name)} HP ${p.hp}/${p.maxHp}</span><span>MP ${p.mp}/${p.maxMp}</span></div>${bar(p.hp,p.maxHp)}<p>行動點 AP：<b>${b.ap}</b>　護盾：${b.shield}　攻擊強化：${b.bonus}</p></div><h3>固定指令</h3><div class="actions"><button class="btn" onclick="basicAttack()" ${b.ap<1?'disabled':''}>⚔️ 普通攻擊 (1 AP)</button><button class="btn" onclick="defend()" ${b.ap<1?'disabled':''}>🛡️ 防禦 (1 AP)</button><button class="btn" onclick="usePotion(true)">🧪 藥水 (${p.inventory['藥水']||0})</button><button class="btn" onclick="flee()" ${b.id==='boss'?'disabled':''}>🏃 逃跑</button></div><h3>技能手牌</h3><div class="cards">${b.hand.map((id,i)=>`<button class="card" onclick="playCard(${i})" ${b.ap<cards[id][1]?'disabled':''}><strong>${cards[id][0]}</strong><span>消耗 ${cards[id][1]} AP</span><small>${cards[id][3]} ${cards[id][2]?'· 基礎威力 '+cards[id][2]:''}</small></button>`).join('')}</div><div class="actions"><button class="btn primary wide" onclick="endTurn()">結束回合 →</button></div><div class="log">${b.logs.slice(-8).map(x=>`<div>• ${esc(x)}</div>`).join('')}</div>`}function damage(power){let p=state.player,e=enemies[battle.id];return Math.max(1,Math.floor((power+p.stats[p.job==='mage'||p.job==='sage'?'INT':'STR']*.65+p.level*2-e.def*.6)*(Math.random()*.1+.95)))}function attack(n){let d=damage(n+battle.bonus);battle.hp=Math.max(0,battle.hp-d);battle.logs.push(`你造成 ${d} 點傷害。`);if(battle.hp<=0)win()}function basicAttack(){if(!battle||battle.ap<1)return;battle.ap--;attack(3);render()}function defend(){if(battle.ap<1)return;battle.ap--;battle.shield+=8+Math.floor(state.player.stats.VIT/3);battle.logs.push('你進入防禦姿態。');render()}function playCard(i){if(!battle)return;let id=battle.hand[i],c=cards[id];if(!c||battle.ap<c[1])return;battle.ap-=c[1];battle.hand.splice(i,1);battle.discard.push(id);let p=state.player;switch(c[3]){case '攻擊':attack(c[2]);break;case '護盾':battle.shield+=13;battle.logs.push(`${c[0]}：獲得13護盾。`);break;case '治療':{let v=Math.min(25,p.maxHp-p.hp);p.hp+=v;battle.logs.push(`治癒 ${v} HP。`);break}case '回魔':p.mp=Math.min(p.maxMp,p.mp+15);battle.logs.push('恢復15 MP。');break;case '強化':battle.bonus+=3;battle.logs.push('攻擊威力提升。');break}render()}function endTurn(){if(!battle)return;let b=battle,e=enemies[b.id],p=state.player;let hit=e.atk+rand(-2,3)+(b.id==='boss'&&b.turn%3===0?8:0);let blocked=Math.min(hit,b.shield);b.shield-=blocked;hit-=blocked;p.hp=Math.max(0,p.hp-hit);b.logs.push(`${e.name} 攻擊，你承受 ${hit} 傷害（護盾抵擋 ${blocked}）。`);if(p.hp<=0){lose();return}b.discard.push(...b.hand);b.hand=[];b.turn++;b.ap=3;b.bonus=0;drawCards(4);save();render()}function gainExp(n){let p=state.player;p.exp+=n;while(p.exp>=p.level*60){p.exp-=p.level*60;p.level++;p.points+=3;p.maxHp+=12;p.maxMp+=4;p.hp=p.maxHp;p.mp=p.maxMp;msg+=' 升級！獲得3點能力點。'}}function achieve(name){if(!state.world.achievements.includes(name))state.world.achievements.push(name)}function win(){let e=enemies[battle.id],p=state.player,w=state.world;let id=battle.id;p.gold+=e.gold;gainExp(e.exp);if(id==='wolf'){w.kills++;p.inventory['狼牙']++}if(id==='boss'){w.boss=true;w.quest=4;achieve('赤鬃狼王討伐者')}msg=`擊敗${e.name}！獲得 ${e.exp} EXP、${e.gold} G。${msg}`;battle=null;advance(.5);save()}function lose(){let p=state.player;let loss=Math.ceil(p.gold*.05);p.gold-=loss;p.durability=Math.max(0,p.durability-10);p.hp=Math.max(1,Math.ceil(p.maxHp*.4));p.mp=Math.ceil(p.maxMp*.3);state.world.location='曙光鎮';battle=null;advance(4);msg=`戰敗後被救回曙光鎮，損失 ${loss} G，裝備耐久 -10%。`;save();render()}function flee(){if(Math.random()<.7){battle=null;msg='你成功撤退。';advance(1);render()}else{battle.logs.push('逃跑失敗！');endTurn()}}function usePotion(inBattle){let p=state.player;if((p.inventory['藥水']||0)<1){msg='沒有藥水。';render();return}if(p.hp===p.maxHp){msg='生命值已滿。';render();return}p.inventory['藥水']--;p.hp=Math.min(p.maxHp,p.hp+45);if(inBattle&&battle)battle.logs.push('使用藥水，恢復生命。');else msg='使用藥水恢復45 HP。';save();render()}function characterView(){let p=state.player;return `<h2>👤 冒險者資料</h2><div class="panel"><div class="portrait">${classes[p.job][1]}</div><h2>${esc(p.name)}</h2><p>${classes[p.job][0]} · 第 ${p.generation} 代 · ${age()} 歲</p><p class="muted">${esc(p.bio)}</p><div class="stat"><span>Lv.${p.level} · EXP ${p.exp}/${p.level*60}</span><span>自由能力點 ${p.points}</span></div>${Object.entries(p.stats).map(([k,v])=>`<div class="stat"><span>${k}：${v}</span><button class="btn" onclick="point('${k}')" ${p.points<=0?'disabled':''}>+1</button></div>`).join('')}</div><div class="panel"><h3>裝備與背包</h3><p>武器：${classes[p.job][0]}的初學者武器</p><p>裝備耐久：${p.durability}%</p><button class="btn" onclick="repair()">修理裝備（${100-p.durability} G）</button>${Object.entries(p.inventory).map(([k,v])=>`<div class="stat"><span>${esc(k)}</span><b>${v}</b></div>`).join('')}</div><div class="panel"><h3>🏆 成就</h3>${state.world.achievements.map(a=>`<span class="tag">${esc(a)}</span>`).join('')||'<p class="muted">尚未取得成就</p>'}</div>`}function point(k){let p=state.player;if(p.points<1||!Object.hasOwn(p.stats,k))return;p.points--;p.stats[k]++;if(k==='VIT'){p.maxHp+=5;p.hp+=5}if(k==='WIL'){p.maxMp+=3;p.mp+=3}save();render()}function repair(){let p=state.player,cost=100-p.durability;if(p.gold<cost){msg='金幣不足。';render();return}p.gold-=cost;p.durability=100;save();msg='裝備修理完成。';render()}function deckView(){let p=state.player;return `<h2>🃏 卡牌圖鑑與牌組</h2><p>目前牌組 ${p.deck.length} 張。每回合抽取4張卡，使用AP施放。</p><div class="cards">${p.deck.map(id=>`<div class="card"><strong>${cards[id][0]}</strong><span>${cards[id][1]} AP</span><small>${cards[id][3]}</small></div>`).join('')}</div><p class="muted">Alpha 0.1.0 先提供固定初始牌組；自由構築與強化預定後續版本開放。</p>`}function lifeView(){let p=state.player;return `<h2>🏠 冒險人生</h2>${scene('曙光鎮的日常','guild')}<div class="panel"><div class="stat"><span>年齡</span><b>${age()} 歲</b></div><div class="stat"><span>金幣</span><b>${p.gold} G</b></div><div class="stat"><span>住宅</span><b>${p.home?'簡陋木屋':'尚未購屋'}</b></div><div class="stat"><span>疲勞</span><b>${p.fatigue}/100</b></div></div><div class="actions"><button class="btn" onclick="work()">🛠️ 工作一天 (+45G)</button><button class="btn" onclick="train()">📚 訓練三天 (+EXP)</button><button class="btn" onclick="buyHome()" ${p.home?'disabled':''}>🏡 購買木屋 (2000G)</button><button class="btn" onclick="homeRest()" ${!p.home?'disabled':''}>🛌 在家休息</button><button class="btn" onclick="retire()" ${p.ageDays/360<50||p.retired?'disabled':''}>📜 退休傳承 (50歲起)</button></div><div class="panel"><h3>世代傳承</h3><p>第 ${p.generation} 代冒險者。50歲後可以退休，並由成年徒弟接續旅程。世界任務及歷史紀錄保留。</p><p class="muted">戀愛、婚姻、子女與完整NPC人生事件將於後續版本擴充。</p></div>`}function work(){advance(8);state.player.gold+=45;state.player.fatigue=Math.min(100,state.player.fatigue+12);msg='完成一天的城鎮工作，獲得45G。';save();render()}function train(){advance(72);gainExp(30);msg='完成三天訓練，獲得30EXP。';save();render()}function buyHome(){let p=state.player;if(p.gold<2000){msg='購屋金幣不足。';render();return}p.gold-=2000;p.home=1;msg='你在曙光鎮購得一間簡陋木屋！';save();render()}function homeRest(){advance(8);state.player.hp=state.player.maxHp;state.player.mp=state.player.maxMp;state.player.fatigue=0;msg='在自己的家中充分休息。';save();render()}function retire(){let p=state.player;if(p.ageDays/360<50)return;if(!confirm(`確定讓 ${p.name} 退休，開啟下一代冒險嗎？角色等級會重置，但保留部分財產與世界紀錄。`))return;let old=p.name;p.generation++;p.name=old+'的傳人';p.ageDays=18*360;p.level=1;p.exp=0;p.points=0;p.hp=100;p.maxHp=100;p.mp=40;p.maxMp=40;p.gold=Math.floor(p.gold*.7);p.durability=100;p.fatigue=0;p.stats={STR:10,INT:10,AGI:10,PER:10,VIT:10,WIL:10};state.world.location='曙光鎮';achieve('世代傳承');msg=`${old} 正式退休。第 ${p.generation} 代冒險者踏上旅程。`;save();render()}function systemView(){return `<h2>⚙️ 系統設定</h2><div class="panel"><h3>儲存進度</h3><p>每次重要操作會自動存檔於瀏覽器本機。</p><div class="actions"><button class="btn" onclick="save();msg='已手動儲存。';render()">💾 手動存檔</button><button class="btn" onclick="exportSave()">⬇️ 匯出存檔</button><label class="btn" style="text-align:center">⬆️ 匯入存檔<input type="file" accept="application/json,.json" style="display:none" onchange="importSave(this)"></label><button class="btn" onclick="resetGame()">🗑️ 重新開始</button></div></div><div class="panel"><h3>版本資訊</h3><p>Alpha 0.1.0 · 手繪奇幻繪本風原型</p><p>已實作：角色創建、六職業、事件探索、卡牌戰鬥、任務、等級、簡易工作住宅、年齡與退休傳承。</p><p class="muted">本版本的背景為程式繪製的繪本色塊示意，尚未置入正式手繪場景與人物立繪。</p><p><a href="https://linktr.ee/LeoTsai0409" target="_blank" rel="noopener noreferrer">更多 LeoTsai 製作</a></p></div>`}function exportSave(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nightfeather-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function importSave(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.version!==1||!d.player||!d.world||!classes[d.player.job]||!Array.isArray(d.player.deck))throw Error('格式不符');state=d;battle=null;event=null;tab='adventure';save();msg='存檔匯入成功。';render()}catch(e){alert('存檔格式無效。')}};r.readAsText(f)}function resetGame(){if(!confirm('確定刪除本機進度並重新開始？請先匯出備份。'))return;localStorage.removeItem(KEY);state=null;battle=null;event=null;msg='';render()}state=load();render();
</script></body></html>
